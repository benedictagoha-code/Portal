<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>psyc@UNIDEL API Bridge</title>
</head>
<body>
<script>
(function () {
  'use strict';
  const ALLOWED_PARENT_ORIGINS = ['https://benedictagoha-code.github.io'];
  const ALLOWED_METHODS = new Set([
    'getPublicInfo','loginUser','validateSession','logoutUser','registerStudent','registerLecturer',
    'getCourses','createCourse','claimCourseAsLecturer','manageCourseLecturer','enrolStudentInCourse',
    'getCourseRoster','uploadMaterial','getMaterials','recordAttendance','bulkUploadAttendance',
    'getCourseAttendanceSummary','getAttendanceData','generateEligibleCandidatesPDF',
    'exportResultsToExcel','getComponentGroupScores','createTest','updateTestSettings','addQuestion',
    'getTestsAndAttempts','getQuestionsForTest','submitCBTAttempt','saveResult','getResults',
    'postAnnouncement','getAnnouncements','createDiscussionTopic','replyDiscussionTopic',
    'getDiscussions','getAdminOverview','toggleUserStatus','getGradeReport',
    'exportGradeReportToExcel','getMessagingSettings','setAllowExternalEmailRecipients',
    'sendPortalEmail','startClassroom','getClassrooms','joinClassroom','leaveClassroom',
    'updateClassroomParticipation','endClassroom','submitClassroomQuestion','getClassroomQuestions','getClassroomAttendance','updateClassroomQuestionStatus'
  ]);

  window.addEventListener('message', function (event) {
    if (event.source !== window.parent || ALLOWED_PARENT_ORIGINS.indexOf(event.origin) === -1) return;
    const msg = event.data || {};
    if (msg.type !== 'PSYC_API_CALL' || typeof msg.id !== 'string') return;
    if (!ALLOWED_METHODS.has(msg.fn) || !Array.isArray(msg.args)) {
      event.source.postMessage({ type:'PSYC_API_RESULT', id:msg.id, ok:false, error:'Unsupported portal request.' }, event.origin);
      return;
    }
    try {
      const runner = google.script.run
        .withSuccessHandler(function (result) {
          event.source.postMessage({ type:'PSYC_API_RESULT', id:msg.id, ok:true, result:result }, event.origin);
        })
        .withFailureHandler(function (err) {
          event.source.postMessage({
            type:'PSYC_API_RESULT', id:msg.id, ok:false,
            error: err && err.message ? err.message : 'Apps Script request failed.'
          }, event.origin);
        });
      runner[msg.fn](...msg.args);
    } catch (err) {
      event.source.postMessage({
        type:'PSYC_API_RESULT', id:msg.id, ok:false,
        error: err && err.message ? err.message : 'Could not start Apps Script request.'
      }, event.origin);
    }
  });
  parent.postMessage({ type:'PSYC_API_BRIDGE_READY' }, '*');
})();
</script>
</body>
</html>
